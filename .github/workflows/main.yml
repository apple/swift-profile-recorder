name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

jobs:
  unit-tests:
    name: Unit tests
    uses: apple/swift-nio/.github/workflows/unit_tests.yml@main
    with:
      # The 6.1 image is Ubuntu 22.04 whose libc lacks frame pointers. The PR workflow works around that by installing
      # libc6-prof but this workflow has no way to run a pre-build command.
      linux_6_1_enabled: false
      linux_5_10_arguments_override: "--explicit-target-dependency-import-check error"
      linux_6_0_arguments_override: "--explicit-target-dependency-import-check error"
      linux_6_2_arguments_override: "--explicit-target-dependency-import-check error"
      linux_6_3_arguments_override: "--explicit-target-dependency-import-check error"
      linux_6_4_arguments_override: "--explicit-target-dependency-import-check error"
      linux_nightly_next_arguments_override: "--explicit-target-dependency-import-check error"
      linux_nightly_main_arguments_override: "--explicit-target-dependency-import-check error"

  cxx-interop:
    name: Cxx interop
    uses: apple/swift-nio/.github/workflows/cxx_interop.yml@main

  static-sdk:
    name: Static SDK
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@main

  macos-tests:
    name: macOS tests
    uses: apple/swift-nio/.github/workflows/macos_tests.yml@main
    with:
      # The nightly pool often takes hours to pick up a job, so only scheduled runs use it.
      runner_pool: ${{ github.event_name == 'schedule' && 'nightly' || 'general' }}
      build_scheme: swift-profile-recorder-Package
      env_vars: "{\"PROTOBUF_NO_PROTOC\": \"true\"}"

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@main
